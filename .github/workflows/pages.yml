name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el proyecto
        uses: actions/checkout@v6

      - name: Preparar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Preparar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Preparar GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Calcular la dirección pública
        shell: bash
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          PAGES_ORIGIN: ${{ steps.pages.outputs.origin }}
        run: |
          echo "NEXT_PUBLIC_BASE_PATH=$PAGES_BASE_PATH" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SITE_ORIGIN=${PAGES_ORIGIN/#http:/https:}" >> "$GITHUB_ENV"

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Construir la web
        run: pnpm build:pages

      - name: Preparar las páginas internas
        run: node scripts/prepare-github-pages.mjs

      - name: Comprobar materiales de los proyectos
        run: node --experimental-strip-types scripts/check-project-dossiers.mjs

      - name: Comprobar versiones ES y EN
        run: node --experimental-strip-types scripts/check-languages.mjs

      - name: Empaquetar la web
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/client

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
